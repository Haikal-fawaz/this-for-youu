<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I Love You</title>
<style>
  html, body { margin: 0; height: 100%; background: #12040a; overflow: hidden; }
  canvas { display: block; }
  #hint {
    position: fixed; bottom: 14px; width: 100%; text-align: center;
    color: #ff9fbf99; font: 14px sans-serif; pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">Gerakkan mouse / klik untuk efek hati ❤</div>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

// "Aku cinta kamu" dalam berbagai bahasa
const words = [
  "I love you", "Aku cinta kamu", "Te amo","you are my love",
  "You are so beautiful", "Eu te amo","Muka Kamu Selalu ada di pikiranku","you are my everything",
  "you pretty girl", "Karin Manis", "Karin Indah Banget", "Mata karin Sangat Indah",
  "Senyum Karin Cantik BGT", "Karin Kawaii ><", "Karin Imutt", "Karin Humoris",
  "Karin Anggun", "Karin type aku", "Karin Menarik",
  "Karin Ayu", "Karin Menggemaskan", "Karin lucu Banget", "Karin cantik banget","AKU SUKA KARIN"
];

let W, H, cx, cy, scale;
function resize() {
  W = canvas.width = innerWidth;
  H = canvas.height = innerHeight;
  cx = W / 2;
  cy = H / 2 - 10;
  scale = Math.min(W, H) / 40;
}
addEventListener("resize", resize);
resize();

// Titik pada kurva hati
function heartPoint(t) {
  return {
    x: 16 * Math.pow(Math.sin(t), 3),
    y: -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t))
  };
}

// Susun kata dalam beberapa lapisan (luar -> dalam)
const layers = [
  { k: 1.0,  n: 26, size: 0.85 },
  { k: 0.72, n: 17, size: 0.8  },
  { k: 0.46, n: 10, size: 0.72 },
  { k: 0.22, n: 4,  size: 0.65 }
];

const items = [];
let wi = 0;
layers.forEach((L, li) => {
  for (let i = 0; i < L.n; i++) {
    const t = (i / L.n) * Math.PI * 2 + li * 0.3;
    const p = heartPoint(t);
    items.push({
      bx: p.x * L.k,
      by: p.y * L.k,
      text: words[wi++ % words.length],
      size: L.size,
      phase: Math.random() * Math.PI * 2,
      hue: 330 + Math.random() * 30,
      ox: 0, oy: 0
    });
  }
});

// Hati kecil yang melayang di latar
const floaters = Array.from({ length: 30 }, () => newFloater(true));
function newFloater(initial) {
  return {
    x: Math.random() * innerWidth,
    y: initial ? Math.random() * innerHeight : innerHeight + 20,
    s: 6 + Math.random() * 14,
    v: 0.3 + Math.random() * 0.9,
    a: 0.1 + Math.random() * 0.25
  };
}

const mouse = { x: -999, y: -999 };
addEventListener("mousemove", e => { mouse.x = e.clientX; mouse.y = e.clientY; });
addEventListener("touchmove", e => {
  mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY;
});

let burst = 0;
addEventListener("click", () => { burst = 1; });

function drawMiniHeart(x, y, s, alpha) {
  ctx.save();
  ctx.translate(x, y);
  ctx.globalAlpha = alpha;
  ctx.fillStyle = "#ff4d88";
  ctx.beginPath();
  ctx.moveTo(0, s / 4);
  ctx.bezierCurveTo(-s / 2, -s / 3, -s, s / 4, 0, s);
  ctx.bezierCurveTo(s, s / 4, s / 2, -s / 3, 0, s / 4);
  ctx.fill();
  ctx.restore();
}

function frame(time) {
  const t = time / 1000;
  ctx.clearRect(0, 0, W, H);

  // Latar: hati melayang naik
  floaters.forEach((f, i) => {
    f.y -= f.v;
    if (f.y < -30) floaters[i] = newFloater(false);
    drawMiniHeart(f.x + Math.sin(t + i) * 10, f.y, f.s, f.a);
  });

  // Detak jantung
  const beat = 1 + 0.05 * Math.pow(Math.sin(t * 3), 8) + 0.03 * Math.sin(t * 3) + burst * 0.12;
  burst *= 0.92;

  // Cahaya di tengah
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, scale * 20 * beat);
  g.addColorStop(0, "rgba(255,60,120,0.28)");
  g.addColorStop(1, "rgba(255,60,120,0)");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  items.forEach(it => {
    let x = cx + it.bx * scale * beat;
    let y = cy + it.by * scale * beat + Math.sin(t * 1.5 + it.phase) * 3;

    // Kata menjauh sedikit dari kursor
    const dx = x - mouse.x, dy = y - mouse.y;
    const d = Math.hypot(dx, dy);
    let tx = 0, ty = 0;
    if (d < 90) {
      const f = (90 - d) / 90;
      tx = (dx / (d || 1)) * f * 30;
      ty = (dy / (d || 1)) * f * 30;
    }
    it.ox += (tx - it.ox) * 0.15;
    it.oy += (ty - it.oy) * 0.15;
    x += it.ox; y += it.oy;

    const fs = Math.max(11, scale * it.size * 1.15);
    ctx.font = `600 ${fs}px "Segoe UI", "Noto Sans", Arial, sans-serif`;
    const light = 62 + 12 * Math.sin(t * 2 + it.phase);
    ctx.fillStyle = `hsl(${it.hue}, 90%, ${light}%)`;
    ctx.shadowColor = `hsl(${it.hue}, 100%, 60%)`;
    ctx.shadowBlur = 10;
    ctx.fillText(it.text, x, y);
  });
  ctx.shadowBlur = 0;

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
